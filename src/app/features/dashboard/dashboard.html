<section class="dashboard">
  <header class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Vue d'ensemble de vos portefeuilles ESG.</p>
  </header>

  <section class="summary" aria-label="Résumé des portefeuilles">
    <app-detail-section class="summary-card" title="Portefeuilles">
      <dl class="summary-metrics">
        <div>
          <dt>Nombre de portefeuilles</dt>
          <dd>{{ portfolioSummary().count }}</dd>
        </div>
        <div>
          <dt>Valeur totale</dt>
          <dd>{{ portfolioSummary().totalValue }} €</dd>
        </div>
      </dl>
    </app-detail-section>

    <app-detail-section class="summary-card" title="Score ESG moyen">
      <p class="summary-score">{{ portfolioSummary().averageEsgScore }} / 100</p>
    </app-detail-section>
  </section>
</section>
